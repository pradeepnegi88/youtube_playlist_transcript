<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10131c" />
    <title>Download playlist — Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="grain"></div>
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark">A</span><span>archive<span class="brand-dot">.</span></span></a>
      <nav class="topnav">
        <a class="topnav-link" href="/">Library</a>
        <a class="topnav-link active" href="/download.html">Download playlist</a>
      </nav>
      <div class="topbar-note"><span class="status-dot"></span> local knowledge base</div>
    </header>
    <main>
      <section class="download-hero">
        <div class="eyebrow">TRANSCRIPT IMPORTER</div>
        <h1>Bring your<br /><em>playlist here.</em></h1>
        <p class="hero-copy">Paste a YouTube playlist link and turn every lesson into a searchable transcript in your local archive.</p>
        <form id="download-form" class="download-form">
          <label class="field-label" for="playlist-url">PLAYLIST LINK</label>
          <input id="playlist-url" type="url" placeholder="https://www.youtube.com/playlist?list=..." required />
          <label class="field-label" for="languages">LANGUAGE CODES</label>
          <input id="languages" type="text" value="en" placeholder="en, hi" />
          <label class="field-label" for="transcript-type">CAPTION SOURCE</label>
          <select id="transcript-type">
            <option value="both">Manual + automatic captions</option>
            <option value="manual">Manual captions only</option>
            <option value="automatic">Automatic captions only</option>
          </select>
          <button id="preview-button" type="button">Preview playlist <span>→</span></button>
          <label class="field-label" for="output-folder">OUTPUT FOLDER</label>
          <input id="output-folder" type="text" value="transcripts" placeholder="transcripts/my-course" />
          <label class="field-label" for="caption-format">FILE TYPES</label>
          <select id="caption-format"><option value="both">VTT + TXT</option><option value="vtt">VTT only</option><option value="txt">TXT only</option></select>
          <label class="field-label" for="filename-format">FILENAMES</label>
          <select id="filename-format"><option value="index_title">01 - title</option><option value="title">title</option><option value="title_id">title [video id]</option></select>
          <label class="field-label" for="duplicate-handling">DUPLICATES</label>
          <select id="duplicate-handling"><option value="skip">Skip existing</option><option value="rename">Keep both (rename)</option><option value="overwrite">Overwrite</option></select>
          <button id="start-button" type="submit">Start download <span>→</span></button>
        </form>
        <div id="playlist-preview" class="playlist-preview" hidden>
          <div class="preview-heading"><strong>Select videos</strong><button type="button" id="select-all">Select all</button></div>
          <div id="preview-meta"></div>
          <div id="video-list"></div>
        </div>
        <div id="download-status" class="download-status" hidden></div>
        <a class="back-link" href="/">← Back to transcript library</a>
      </section>
    </main>
    <script>
      window.ARCHIVE_API_URL = "";
    </script>
    <script src="/analytics.bundle.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
